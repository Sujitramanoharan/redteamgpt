version: '3.8'

services:
  redteamgpt-firewall:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redteamgpt_firewall
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
      - LOG_LEVEL=info
      - WORKERS=2
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    resources:
      limits:
        cpus: '2.0'
        memory: 2G
      reservations:
        cpus: '0.5'
        memory: 512M
