# Production-shaped local stack: the app container plus Postgres, as on Render.
#   cp .env.example .env    # fill in ENCRYPTION_KEY, MODEL_HUB_ID, etc.
#   docker compose up --build
# Then open http://localhost:7860. With SMTP unset, sign-up links are printed
# in `docker compose logs app`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: redteamgpt
      POSTGRES_USER: redteamgpt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-redteamgpt-local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redteamgpt"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-7860}:7860"
    env_file: .env
    environment:
      PORT: 7860
      DATABASE_URL: postgresql://redteamgpt:${POSTGRES_PASSWORD:-redteamgpt-local}@db:5432/redteamgpt
      # Local stack runs over plain http, so relax the production checks that
      # only make sense behind TLS. Never set these on a public deployment.
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:7860}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

volumes:
  pgdata:
